<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Самолёт</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="show.css?v=0.6.1">
  <script src="startup.js?v=0.6.1" defer></script>
  <script src="network-config.js?v=0.6.1" defer></script>
  <script src="catalog-share.js?v=0.6.1" defer></script>
  <script src="story-public.js?v=0.6.1" defer></script>
  <script src="projects.js?v=0.6.1" defer></script>
  <script src="audience-story.js?v=0.6.1" defer></script>
  <script src="eco-layouts.js?v=0.6.1" defer></script>
  <script src="living-scenes.js?v=0.6.1" defer></script>
  <script src="visual-context.js?v=0.6.1" defer></script>
  <script src="show.js?v=0.6.1" defer></script>
</head>
<body data-role="client">
  <section id="startup-notice" class="startup-notice" aria-label="Загрузка показа">
    <p role="status">Загружаем показ…</p>
    <a href="">Открыть свежую страницу</a>
  </section>
  <header class="bar">
    <div class="app-identity">
      <span class="app-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg></span>
      <b>Самолёт</b>
      <span id="client-mode" class="mode" hidden></span>
    </div>
    <nav id="company-navigation" class="company-navigation" aria-label="О Самолёте" hidden>
      <button type="button" data-company-scene="P01" class="secondary">История</button>
      <button type="button" data-company-scene="P02" class="secondary">О Самолёте</button>
      <button type="button" data-company-scene="P03" class="secondary">Как выбираем</button>
    </nav>
  </header>
  <main class="layout client-panel">
    <section id="stage" class="stage" aria-label="Общий кадр">
      <p class="waiting" role="status">Подключаемся к показу…</p>
    </section>
    <section id="catalog-live" class="catalog-live" aria-label="Прямой показ вкладки" hidden>
      <h1>Подбор квартир · Прямой показ</h1>
      <canvas id="catalog-frame" role="img" aria-label="Изображение выбранной вкладки"></canvas>
    </section>
    <p id="catalog-view-status" class="catalog-view-status" role="status" hidden></p>
  </main>
</body>
</html>
